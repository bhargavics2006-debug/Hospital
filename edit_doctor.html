<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Doctor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="navbar">
            <a href="{{ url_for('index') }}">🏠 Home</a>
            <a href="{{ url_for('doctors') }}">👨‍⚕️ Doctors</a>
        </div>

        <div class="form-container">

            <h2>✏️ Edit Doctor</h2>

            <form method="POST">

                <div class="form-group">
                    <label>Doctor Name</label>

                    <input type="text"
                           name="name"
                           value="{{ doctor['name'] }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Specialization</label>

                    <input type="text"
                           name="specialization"
                           value="{{ doctor['specialization'] }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>

                    <input type="tel"
                           name="phone"
                           value="{{ doctor['phone'] }}"
                           required>
                </div>

                <button type="submit" class="btn">
                    Update Doctor
                </button>

            </form>

        </div>

    </div>

</body>
</html>
