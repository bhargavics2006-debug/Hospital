<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Patient</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="navbar">
            <a href="{{ url_for('index') }}">🏠 Home</a>
            <a href="{{ url_for('patients') }}">👥 Patients</a>
        </div>

        <div class="form-container">

            <h2>✏️ Edit Patient</h2>

            <form method="POST">

                <div class="form-group">
                    <label>Patient Name</label>
                    <input type="text"
                           name="name"
                           value="{{ patient['name'] }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number"
                           name="age"
                           value="{{ patient['age'] }}"
                           min="1"
                           required>
                </div>

                <div class="form-group">
                    <label>Gender</label>

                    <select name="gender" required>
                        <option value="Male"
                            {% if patient['gender'] == 'Male' %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if patient['gender'] == 'Female' %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                            {% if patient['gender'] == 'Other' %}selected{% endif %}>
                            Other
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel"
                           name="phone"
                           value="{{ patient['phone'] }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Disease / Problem</label>
                    <input type="text"
                           name="disease"
                           value="{{ patient['disease'] }}"
                           required>
                </div>

                <button type="submit" class="btn">
                    Update Patient
                </button>

            </form>

        </div>

    </div>

</body>
</html>
